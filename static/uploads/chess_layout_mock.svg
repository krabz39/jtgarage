<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <defs>
    <style>
      .bg{fill:#181A2F}
      .panel{fill:#0f1526; stroke:#1d2438; stroke-width:2}
      .slot{fill:#0b1220; stroke:#1d2438; stroke-width:2}
      .label{fill:#eef1f6; font-family:Segoe UI, Roboto, Arial, sans-serif; font-size:18px}
      .title{fill:#eef1f6; font-family:Segoe UI, Roboto, Arial, sans-serif; font-size:28px; font-weight:700}
      .sub{fill:#9ca3af; font-family:Segoe UI, Roboto, Arial, sans-serif; font-size:16px}
      .pill{fill:#54162B}
      .btn{fill:#FDA481}
      .wire{stroke:#37415C; stroke-width:2; stroke-dasharray:6 6; fill:none}
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1400" height="900"/>
  <!-- Header -->
  <rect class="panel" x="30" y="20" width="1340" height="80" rx="12"/>
  <text class="title" x="60" y="70">Chess Hub — Play &amp; Analyze</text>
  <text class="sub" x="1000" y="70">Subnav: Play • Analysis • Strategy Packs • Tactics • Openings</text>
  <!-- Left column -->
  <rect class="panel" x="30" y="120" width="820" height="660" rx="14"/>
  <text class="label" x="50" y="155">Left: Board &amp; Controls</text>
  <!-- Board -->
  <rect class="slot" x="60" y="180" width="520" height="520" rx="12"/>
  <text class="label" x="75" y="210">Board Area (chessboard.js)</text>
  <!-- Clocks -->
  <rect class="slot" x="600" y="180" width="220" height="90" rx="10"/>
  <text class="label" x="615" y="210">Clocks</text>
  <!-- Controls -->
  <rect class="slot" x="600" y="290" width="220" height="110" rx="10"/>
  <text class="label" x="615" y="318">Controls</text>
  <rect class="btn" x="615" y="356" width="90" height="28" rx="8"/>
  <rect class="btn" x="715" y="356" width="90" height="28" rx="8"/>
  <!-- Status -->
  <rect class="pill" x="600" y="420" width="220" height="40" rx="20"/>
  <text class="label" x="615" y="447">Turn: White   •   Status: Synced</text>
  <!-- Engine controls -->
  <rect class="slot" x="600" y="470" width="220" height="230" rx="10"/>
  <text class="label" x="615" y="500">Engine</text>
  <rect class="btn" x="615" y="565" width="180" height="34" rx="8"/>
  <text class="label" x="655" y="588">Engine Move</text>
  <!-- Right column -->
  <rect class="panel" x="870" y="120" width="500" height="660" rx="14"/>
  <text class="label" x="890" y="155">Right: Analysis</text>
  <!-- Move list -->
  <rect class="slot" x="890" y="180" width="460" height="180" rx="10"/>
  <text class="label" x="905" y="210">Move List (SAN / PGN)</text>
  <!-- Eval graph -->
  <rect class="slot" x="890" y="380" width="460" height="150" rx="10"/>
  <text class="label" x="905" y="410">Evaluation Graph</text>
  <!-- What-if explorer -->
  <rect class="slot" x="890" y="550" width="460" height="210" rx="10"/>
  <text class="label" x="905" y="580">What-if Explorer (best lines)</text>
  <!-- Footer -->
  <text class="sub" x="30" y="820">Actions: New Game • Export PGN • Export PDF • Share HTML</text>
</svg>
