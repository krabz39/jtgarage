<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>{{ brand.name }} Admin</title>
<style>
:root {
  --accent: {{ brand.accent }};
  --accent-dark:#154f2c;
  --bg-light:#f4f5f3;
  --card-light:#fff;
  --text-light:#111;
  --border-light:#e5e7eb;
  --bg-dark:#0e1210;
  --card-dark:#1a1f1a;
  --text-dark:#f8f8f8;
  --border-dark:#2d2f2d;
}
body{margin:0;font-family:"Inter",system-ui,-apple-system,Segoe UI,Roboto;background:var(--bg-light);color:var(--text-light);transition:.3s;-webkit-font-smoothing:antialiased;}
body.dark{background:var(--bg-dark);color:var(--text-dark);}
img{max-width:100%;height:auto;}
header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;background:var(--card-light);border-bottom:1px solid var(--border-light);box-shadow:0 2px 6px rgba(0,0,0,.05);flex-wrap:wrap;gap:10px;}
body.dark header{background:var(--card-dark);border-color:var(--border-dark);}
header h2{margin:0;font-size:clamp(16px,3vw,22px);text-transform:uppercase;letter-spacing:.5px;}
header a{text-decoration:none;color:#fff;background:var(--accent);padding:8px 12px;border-radius:8px;font-weight:600;transition:.2s;}
header a:hover{background:var(--accent-dark);}
.theme-toggle{display:flex;align-items:center;gap:6px;font-weight:600;cursor:pointer;}
.wrap{max-width:1200px;margin:20px auto;padding:0 16px;}
.tools{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-start;margin-bottom:15px;}
.tools button,.tools input[type=file]{padding:8px 12px;border-radius:8px;border:1px solid var(--border-light);background:var(--card-light);font-weight:600;cursor:pointer;transition:.2s;flex:1 1 auto;min-width:120px;}
.tools button:hover{background:#f1f1f1;}
body.dark .tools button,body.dark .tools input[type=file]{background:var(--card-dark);border-color:var(--border-dark);color:var(--text-dark);}
.table-container{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.05);}
table{width:100%;border-collapse:collapse;background:var(--card-light);min-width:600px;}
body.dark table{background:var(--card-dark);}
th,td{padding:10px;border-bottom:1px solid var(--border-light);text-align:left;vertical-align:middle;font-size:14px;}
body.dark th,body.dark td{border-color:var(--border-dark);}
th{background:#fafafa;text-transform:uppercase;color:#555;}
body.dark th{background:#222;color:#ccc;}
tr:hover{background:rgba(0,0,0,.03);}
body.dark tr:hover{background:rgba(255,255,255,.06);}
td img.thumb{width:40px;height:40px;border-radius:6px;object-fit:cover;margin-right:6px;vertical-align:middle;}
button{background:var(--accent);border:0;border-radius:6px;padding:7px 10px;color:#fff;cursor:pointer;font-weight:600;transition:background .2s;}
button:hover{background:var(--accent-dark);}
button.delete{background:#b91c1c;}
button.delete:hover{background:#991111;}
#login{background:var(--card-light);padding:25px 20px;max-width:420px;margin:50px auto;border-radius:12px;box-shadow:0 4px 12px rgba(0,0,0,.05);}
body.dark #login{background:var(--card-dark);}
#login input{width:100%;padding:12px;border:1px solid var(--border-light);border-radius:8px;margin-top:10px;font-size:15px;background:var(--card-light);color:var(--text-light);}
body.dark #login input{background:var(--card-dark);color:var(--text-dark);border-color:var(--border-dark);}
#login button{width:100%;margin-top:14px;}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:50;padding:10px;}
#modal .box{background:var(--card-light);padding:20px;border-radius:12px;width:400px;max-width:95%;box-shadow:0 4px 16px rgba(0,0,0,.15);animation:fadeIn .3s ease;overflow-y:auto;max-height:90vh;}
body.dark #modal .box{background:var(--card-dark);}
@keyframes fadeIn{from{opacity:0;transform:scale(.95);}to{opacity:1;transform:scale(1);}}
.preview img{max-width:100%;height:auto;border-radius:10px;margin-top:8px;border:1px solid var(--border-light);}
body.dark .preview img{border-color:var(--border-dark);}
footer{text-align:center;color:#888;font-size:13px;margin-top:40px;padding:20px;}
@media(max-width:800px){header{flex-direction:column;align-items:flex-start;gap:8px}.tools{flex-direction:column}button,.tools input[type=file]{width:100%}}
@media(max-width:500px){th,td{font-size:12px;padding:8px}header a,header .theme-toggle{font-size:13px}#modal .box{width:95%;padding:16px}td img.thumb{width:32px;height:32px}}
</style>
</head>

<body>
<header>
  <h2>{{ brand.name }} Admin</h2>
  <div style="display:flex;align-items:center;flex-wrap:wrap;gap:10px;">
    <span id="loginBadge" style="font-weight:600;color:var(--accent);display:none;">🔒 Logged in as <b id="username">admin</b></span>
    <a id="logoutBtn" href="/admin/logout" style="display:none;">Logout</a>
    <div class="theme-toggle">🌙 <input id="themeSwitch" type="checkbox"> ☀️</div>
    <a href="/">← Back</a>
  </div>
</header>

<div class="wrap">
  <section id="login">
    <h3>Admin Login</h3>
    <input id="user" placeholder="Username">
    <input id="pass" type="password" placeholder="Password">
    <button onclick="login()">Login</button>
    <p id="msg" style="color:#b91c1c;font-weight:600;"></p>
  </section>

  <section id="dash" style="display:none;">
    <div class="tools">
      <button onclick="openNew()">＋ New Product</button>
      <button onclick="exportCSV()">⬇ Export CSV</button>
      <input type="file" id="csv" accept=".csv" onchange="importCSV(this.files[0])">
      <button onclick="window.open('/admin/repair-db','_blank')">🧩 Repair DB</button>
    </div>
    <div class="table-container">
      <table id="tbl">
        <thead><tr><th>ID</th><th>Product</th><th>Price</th><th>Stock</th><th>Actions</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </section>
</div>

<div id="modal">
  <div class="box">
    <h3 id="mtitle">New Product</h3>
    <input id="pname" placeholder="Product Name">
    <input id="pprice" type="number" placeholder="Price (KES)">
    <input id="pcat" placeholder="Category">
    <button type="button" onclick="openTree()" style="margin:6px 0;background:#eee;color:#111;width:100%;">📂 Choose from Tree</button>
    <input id="pstock" type="number" placeholder="Stock Quantity">
    <textarea id="pdesc" placeholder="Description" rows="4" style="margin-top:8px;border-radius:8px;padding:10px;width:100%;border:1px solid #ddd;"></textarea>
    <input type="file" id="pimg" accept="image/*" onchange="preview(this)">
    <div class="preview"><img id="pview" style="display:none"></div>
    <button onclick="save()">Save</button>
    <button onclick="closeModal()" style="background:#999;margin-top:6px">Cancel</button>
  </div>
</div>

<!-- CATEGORY TREE -->
<div id="catTree" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:99;align-items:center;justify-content:center;">
  <div style="background:#fff;color:#000;border-radius:12px;max-width:600px;width:95%;max-height:85vh;overflow-y:auto;padding:20px;">
    <h3>Choose Category</h3>
    <ul id="categoryTree" style="list-style:none;padding:0;margin:0;"></ul>
    <button onclick="closeTree()" style="margin-top:10px;background:#b91c1c;width:100%;">Close</button>
  </div>
</div>

<footer>© {{ brand.name }} — Admin Control Panel</footer>

<script>
const themeSwitch=document.getElementById('themeSwitch');
if(window.matchMedia('(prefers-color-scheme: dark)').matches){document.body.classList.add('dark');themeSwitch.checked=true;}
themeSwitch.addEventListener('change',()=>{document.body.classList.toggle('dark',themeSwitch.checked);localStorage.setItem('jt_theme',themeSwitch.checked?'dark':'light');});
if(localStorage.getItem('jt_theme')==='dark'){document.body.classList.add('dark');themeSwitch.checked=true;}

function login(){
 const u=document.getElementById('user').value,p=document.getElementById('pass').value;
 fetch('/admin',{method:'POST',body:new URLSearchParams({username:u,password:p})})
 .then(r=>r.text()).then(t=>{if(t.includes('Admin'))location.reload();else document.getElementById('msg').textContent='Invalid username or password';});
}

let products=[],editing=null;
async function load(){
 try{
   const s=await fetch('/admin/status').then(r=>r.json());
   if(!s.logged_in){document.getElementById('login').style.display='block';document.getElementById('dash').style.display='none';return;}
   document.getElementById('username').textContent=s.username||'admin';
   document.getElementById('login').style.display='none';document.getElementById('dash').style.display='block';
   document.getElementById('loginBadge').style.display='inline-block';document.getElementById('logoutBtn').style.display='inline-block';
   const r=await fetch('/api/products');products=await r.json();
   document.querySelector('#tbl tbody').innerHTML=Array.isArray(products)?products.map(p=>`
     <tr>
       <td>${p.id}</td>
       <td><img src="/static/${p.img||'placeholder.jpg'}" class="thumb">${p.name}</td>
       <td>${p.price_kes}</td><td>${p.stock}</td>
       <td><button onclick='edit(${p.id})'>Edit</button><button class="delete" onclick='delp(${p.id})'>Delete</button></td>
     </tr>`).join(''):`<tr><td colspan='5'>Error loading</td></tr>`;
 }catch(e){console.error(e);}
}
function openNew(){editing=null;resetForm();document.getElementById('mtitle').textContent='New Product';openModal();}
function edit(id){const p=products.find(x=>x.id==id);editing=p;openModal();pname.value=p.name;pprice.value=p.price_kes;pcat.value=p.category;pstock.value=p.stock;pdesc.value=p.description||'';}
function resetForm(){pname.value='';pprice.value='';pcat.value='';pstock.value='';pdesc.value='';pimg.value='';pview.style.display='none';}
function openModal(){modal.style.display='flex';document.body.style.overflow='hidden';}
function closeModal(){modal.style.display='none';document.body.style.overflow='';}
function preview(i){const f=i.files[0];if(!f)return;const u=URL.createObjectURL(f);pview.src=u;pview.style.display='block';}
function save(){if(!pname.value)return alert("Name required");const fd=new FormData();
fd.append('name',pname.value);fd.append('price_kes',pprice.value);fd.append('category',pcat.value);
fd.append('stock',pstock.value);fd.append('description',pdesc.value);
if(pimg.files[0])fd.append('img',pimg.files[0]);
fetch(editing?`/admin/products/${editing.id}/edit`:'/admin/products/new',{method:'POST',body:fd}).then(()=>{closeModal();load();});
}
function delp(id){if(confirm('Delete this product?'))fetch(`/admin/products/${id}/delete`,{method:'POST'}).then(load);}

/* ---------------- CATEGORY TREE ---------------- */
const treeData={
"Engine & Powertrain":["engine block","pistons / rings","camshaft / crankshaft","cylinder head / gasket set","timing belt / timing chain kit","oil pump","fuel injectors","turbocharger","intercooler","radiator","engine mounts"],
"Transmission / Gearbox":["manual gearbox","automatic gearbox","transfer case","clutch kit","flywheel","prop shaft","universal joints (UJ)","shift linkage","gearbox mounts"],
"Suspension":["control arms","radius arms","track rod","panhard rod","ball joints","tie rod ends","shocks / struts","springs","air suspension bags","sway bar links"],
"Braking System":["brake pads","brake discs / rotors","brake calipers","brake booster","ABS module","brake hoses","brake fluid reservoir","handbrake cable"],
"Steering System":["power steering pump","steering rack","steering box (older Defenders)","drag link","drop arm","steering column","steering knuckle","power steering hoses"],
"Body Exterior":["fenders","bonnet / hood","doors","hinges","bumpers","grille","door seals / weather strips","roof panels","snorkel kit"],
"Body Interior":["dashboard","instrument cluster","steering wheel","seats & rails","seat belts","door cards","floor mats","headliner"],
"Electrical and Electronics":["alternator","starter motor","ECU / control modules","wiring harness","relays + fuse box","sensors (O2, ABS, MAF, MAP etc.)","ignition coils","spark plugs","battery","switches"],
"HVAC (Cooling & AC)":["AC compressor","condenser","evaporator","heater core","blower motor","thermostat","coolant expansion tank","radiator fan"],
"Fuel System":["fuel pump","fuel filters","fuel tank","fuel lines","injectors","EGR valve"],
"Exhaust":["exhaust manifold","catalytic converter","DPF filter","muffler / silencer","exhaust pipes"],
"Offroad / Aftermarket Upgrades":["lift kits","winch","bull bar","light bar + spot lights","diff lockers","rock sliders","roof racks","snorkels"]
};
function openTree(){
 const list=document.getElementById('categoryTree');
 list.innerHTML='';
 for(const [main,subs] of Object.entries(treeData)){
   const li=document.createElement('li');
   li.innerHTML=`<b style="cursor:pointer;display:block;margin:8px 0;">${main}</b>
   <ul style="list-style:none;margin:0 0 8px 12px;padding:0;display:none;"></ul>`;
   const subList=li.querySelector('ul');
   subs.forEach(s=>{
     const sub=document.createElement('li');
     sub.innerHTML=`<a href="#" style="display:block;padding:4px 0;color:#1C6B3C;">${s}</a>`;
     sub.onclick=e=>{e.preventDefault();document.getElementById('pcat').value=`${main} > ${s}`;closeTree();};
     subList.appendChild(sub);
   });
   li.querySelector('b').onclick=()=>{subList.style.display=subList.style.display==='none'?'block':'none';};
   list.appendChild(li);
 }
 document.getElementById('catTree').style.display='flex';
}
function closeTree(){document.getElementById('catTree').style.display='none';}

load();
</script>
</body>
</html>
